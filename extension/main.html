<!doctype html>
<html>
  <head>
    <title>Contextual</title>
    <link rel="stylesheet" href="style.css">

  </head>
  <body>
    <div id="toggle-container">
      <label for="break" class="cbText">
        <input type="checkbox" class="cbox" name="break" id="break">
        Break
      </label>

      <label for="breakLine" class="cbText">
        <input type="checkbox" class="cbox" name="break-line" id="breakLine">
        Break Line
      </label>
      
      <label for="newHeading" class="cbText">
        <input type="checkbox" class="cbox" name="new-heading" id="newHeading">
        New Heading
      </label>
      <label for="time" class="cbText">
        <input type="checkbox" class="cbox" name="time" id="time">
        add-time
      </label>
      
    </div>
    <div id="tree"></div>

    <form id="contentForm" class="content-form">
      <div class="form-field">
        <label for="formTitle" class="form-label">Title:</label>
        <input type="text" id="formTitle" name="title" class="form-input">
      </div>
      
      <div class="form-field">
        <label for="formContent" class="form-label">Content: <span class="required-asterisk">*</span></label>
        <input type="text" id="formContent" name="content" required class="form-input">
      </div>
      
      <div class="form-field">
        <label for="formPath" class="form-label">Path: <span class="required-asterisk">*</span></label>
        <input type="text" id="formPath" name="path" required disabled class="form-input form-input-disabled">
      </div>
      
      <div class="form-field">
        <label for="formNote" class="form-label">Note:</label>
        <textarea id="formNote" name="note" rows="4" class="form-textarea"></textarea>
      </div>
    </form>

    <label for="newNode" class="cbText">
      <input type="checkbox" class="cbox" name="new-node" id="newNode">
      New Node
    </label>
    <br>
    <button id="submit" >Submit</button>
    <script src="scripts/tree.js"></script>
  </body>
</html>
